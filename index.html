    /* Önemli olay / popüler etkileşim skoru */
    function getPinImportance(pin) {
      const txt = (pin.content_text || '').toLowerCase();
      const hasAlertWord = IMPORTANT_KEYWORDS.some(k => txt.includes(k));
      const likes = pin.likes_count || 0;
      const upvotes = pin.upvotes_count || 0;
      const score = likes * 2 + upvotes * 3 + (hasAlertWord ? 15 : 0);
      const isTrending = score >= 10 || hasAlertWord;
      return { score, isTrending, hasAlertWord };
    }

    function fuzzCoords(lat, lng) {
      const radiusMeters = 120 + Math.random() * 80;
      const angle = Math.random() * 2 * Math.PI;
      const dLat = (radiusMeters * Math.cos(angle)) / 111320;
      const dLng = (radiusMeters * Math.sin(angle)) / (111320 * Math.cos(lat * Math.PI / 180));
      return [lat + dLat, lng + dLng];
    }

    function calcAgeFromBirth(birthStr) {
      if (!birthStr) return null;
      const b = new Date(birthStr), now = new Date();
      let age = now.getFullYear() - b.getFullYear();
      const m = now.getMonth() - b.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
      return age;
    }

    function checkIsBirthday(birthStr) {
      if (!birthStr) return false;
      const b = new Date(birthStr), now = new Date();
      return (b.getMonth() === now.getMonth() && b.getDate() === now.getDate());
    }

    function renderDemoBadge(profile) {
      if (!profile) return '';
      const g = profile.gender || '';
      const age = profile.age ? parseInt(profile.age, 10) : calcAgeFromBirth(profile.birth_date);
      if (!g && !age) return '';
      let icon = '', cls = 'demo-other';
      if (g === 'female') { icon = '👩'; cls = 'demo-female'; }
      else if (g === 'male') { icon = '👨'; cls = 'demo-male'; }
      else if (g === 'other') { icon = '🧑'; cls = 'demo-other'; }
      const text = [icon, age ? age : ''].filter(Boolean).join(' ');
      return `<span class="demo-badge ${cls}">${text}</span>`;
    }

    function formatTime(iso) { if (!iso) return ''; return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

      }
      if (profile && profile.avatar_url) return `<img src="${esc(profile.avatar_url)}" />`;
      return esc((profile && profile.avatar_emoji) || fallbackEmoji);
    }

    function playNotifSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getRemainingHoursText(expiresAt) {
      if (!expiresAt) return '⏳ 24s';
      const diffMs = new Date(expiresAt) - new Date();
      if (diffMs <= 0) return '⌛ Süresi Doldu';
      const hrs = Math.ceil(diffMs / (1000 * 60 * 60));
      return hrs > 24 ? `🚩 ${Math.ceil(hrs/24)} gün` : `⏳ ${hrs}s`;
    }

      else myLocationMarker = L.marker(coords, { icon: myLocIcon, zIndexOffset: 1000 }).addTo(map);

    function setMapStyle(mode) {
      if (!map || !tileLayerObj) return;
      currentMapMode = mode;
      map.removeLayer(tileLayerObj);
      document.querySelectorAll('.mm-tab').forEach(el => el.classList.remove('active'));
      const activeTab = document.getElementById('mm-' + mode);
      if (activeTab) activeTab.classList.add('active');

      if (mode === 'satellite') {
        tileLayerObj = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
      } else if (mode === 'street') {
        tileLayerObj = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      } else {
        tileLayerObj = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'dark-tiles' }).addTo(map);
      }
    }

    function initSwipeMapBar() {
      const bar = document.getElementById('mapModeSwipeBar');
      if (!bar) return;
      let startX = 0;
      const modes = ['dark', 'satellite', 'street'];
      bar.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
      bar.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - startX;
        if (Math.abs(diffX) < 25) return;
        const idx = modes.indexOf(currentMapMode);
        if (diffX < 0 && idx < modes.length - 1) setMapStyle(modes[idx + 1]);
        else if (diffX > 0 && idx > 0) setMapStyle(modes[idx - 1]);
      }, { passive: true });
    }

    function setupRealtimeChannel() {
      if (!sb || !currentUser || realtimeChatChannel) return;
      realtimeChatChannel = sb.channel('vibepin-global-live')
        .on('broadcast', { event: 'typing' }, ({ payload }) => {
          if (!payload || payload.to !== currentUser.id) return;
          if (blockedIds.includes(payload.from) || blockedByIds.includes(payload.from)) return;
          const senderId = payload.from;
          typingUsersMap[senderId] = true;
          updateTypingIndicators();
          if (typingHideTimers[senderId]) clearTimeout(typingHideTimers[senderId]);
          typingHideTimers[senderId] = setTimeout(() => { delete typingUsersMap[senderId]; updateTypingIndicators(); }, 2600);
        })
        .on('broadcast', { event: 'pin_refresh' }, () => { loadPins(); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'pins' }, () => { loadPins(); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'blocked_users' }, async () => {
          await loadBlockedUsers();
          if (activeChatFriend) loadDirectMessages();
          if (document.getElementById('friendsModal').classList.contains('open')) refreshFriendsData();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications' }, (payload) => {
          if (payload.new && payload.new.user_id === currentUser.id) { playNotifSound(); checkNotifications(); }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'direct_messages' }, (payload) => {
          const row = payload.new || payload.old;
          if (!row) return;
          if (row.receiver_id === currentUser.id || row.sender_id === currentUser.id) {
            if (activeChatFriend && (row.sender_id === activeChatFriend.id || row.receiver_id === activeChatFriend.id)) {
              delete typingUsersMap[activeChatFriend.id];
              updateTypingIndicators();
              loadDirectMessages();
            }
            if (document.getElementById('friendsModal').classList.contains('open')) refreshFriendsData();
            checkNotifications();
          }
        })
        .subscribe();
    }

    function handleDmTyping() {
      if (!realtimeChatChannel || !activeChatFriend || !currentUser) return;
      if (blockedIds.includes(activeChatFriend.id) || blockedByIds.includes(activeChatFriend.id)) return;
      const now = Date.now();
      if (now - lastTypingSentAt > 1200) {
        lastTypingSentAt = now;
        realtimeChatChannel.send({ type: 'broadcast', event: 'typing', payload: { from: currentUser.id, to: activeChatFriend.id } });
      }
    }

    function updateTypingIndicators() {
      if (activeChatFriend) {
        const sub = document.getElementById('chatStatusSub');
        const isBlocked = blockedIds.includes(activeChatFriend.id) || blockedByIds.includes(activeChatFriend.id);
        if (isBlocked) sub.textContent = '';
        else if (typingUsersMap[activeChatFriend.id]) { sub.textContent = t('typing_txt'); sub.style.color = 'var(--wa-green)'; }
        else { sub.textContent = t('online_sub'); sub.style.color = '#8696a0'; }
      }
      if (document.getElementById('friendsModal').classList.contains('open') && waTab === 'chats') renderWaChatList();
    }

    async function gateSignIn() {
      const btn = document.getElementById('loginBtn'), status = document.getElementById('loginStatus');
      const email = document.getElementById('gateEmail').value.trim(), password = document.getElementById('gatePass').value.trim();
      if (!email || !password) { status.textContent = 'Lütfen e-posta ve şifrenizi girin.'; return; }
      btn.disabled = true; status.style.color = '#38bdf8'; status.textContent = '⏳...';

    async function gateSignUp() {
      const btn = document.getElementById('signupBtn'), status = document.getElementById('loginStatus');
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPass').value.trim();
      const gender = document.getElementById('regGender').value;
      const birthDate = document.getElementById('regBirthDate').value;
      const interests = Array.from(document.querySelectorAll('#regInterestsGrid .int-chip.selected')).map(el => el.getAttribute('data-val'));

      if (!username || username.length < 3) { status.textContent = 'En az 3 karakterli benzersiz bir kullanıcı adı yazın.'; return; }
      if (!email || password.length < 6) { status.textContent = 'Geçerli bir e-posta ve en az 6 haneli şifre girin.'; return; }
      if (birthDate) {
        const ageCheck = calcAgeFromBirth(birthDate);
        if (ageCheck !== null && ageCheck < 13) { status.textContent = 'Uygulamayı kullanmak için en az 13 yaşında olmalısınız.'; return; }
      }

      btn.disabled = true; status.style.color = '#38bdf8'; status.textContent = '⏳ Hesap oluşturuluyor...';
      const { data, error } = await sb.auth.signUp({ email, password });
      btn.disabled = false;
      if (error) { status.style.color = '#f87171'; status.textContent = error.message; return; }

      if (data.user) {
        const calcAge = calcAgeFromBirth(birthDate);
        await sb.from('profiles').upsert({
          id: data.user.id, username,
          avatar_emoji: gender === 'female' ? '👸' : (gender === 'male' ? '🦁' : '🦊'),
          gender: gender || null, birth_date: birthDate || null, age: calcAge,
          interests, trust_score: 100, username_updated_at: new Date().toISOString()
        });
      }

      if (data.session) { status.textContent = ''; await enterApp(data.user); }
      else { status.style.color = '#10b981'; status.textContent = '✅ Kayıt tamamlandı! Giriş Yap sekmesinden giriş yapabilirsiniz.'; switchAuthMode('login'); }
    }

    async function saveProfile() {
      const nameInput = document.getElementById('profileNameInput');
      const newName = nameInput.value.trim() || myProfile.username;
      const nameChanged = (newName !== myProfile.username);
      const genderVal = document.getElementById('profileGenderInput').value;
      const birthVal = document.getElementById('profileBirthInput').value;
      const ageVal = calcAgeFromBirth(birthVal) ?? myProfile.age;
      const interestsVal = Array.from(document.querySelectorAll('#profileInterestsGrid .int-chip.selected')).map(el => el.getAttribute('data-val'));

      if (ageVal !== null && (ageVal < 13 || ageVal > 99)) return showToast('⚠️ Yaş 13 ile 99 arasında olmalıdır.');
      if (nameChanged && !isFounder()) {
        if (newName.length < 3 || newName.length > 20) return showToast('Kullanıcı adı 3–20 karakter olmalıdır.');
        if (myProfile.username_updated_at) {
          const daysPassed = (Date.now() - new Date(myProfile.username_updated_at).getTime()) / (1000 * 3600 * 24);
          if (daysPassed < 14) return showToast(`Bekleme süresi: ${Math.ceil(14 - daysPassed)} gün.`);
        }
      }

      if (selectedAvatarFile) {
        const ext = selectedAvatarFile.name.split('.').pop() || 'jpg';
        const path = `${currentUser.id}/avatar_${Date.now()}.${ext}`;
        const { error: upErr } = await sb.storage.from('vibe-media').upload(path, selectedAvatarFile);
        if (!upErr) myProfile.avatar_url = sb.storage.from('vibe-media').getPublicUrl(path).data.publicUrl;
      }

      const payload = { id: currentUser.id, username: newName, avatar_emoji: myProfile.avatar_emoji, avatar_url: myProfile.avatar_url, gender: genderVal || null, birth_date: birthVal || null, age: ageVal, interests: interestsVal };
      if (nameChanged) payload.username_updated_at = new Date().toISOString();

      const { error } = await sb.from('profiles').upsert(payload);
      if (error) {
        if (error.message && error.message.includes('unique')) return showToast('⚠️ Bu kullanıcı adı alınmış.');
        return showToast(error.message);
      }
      Object.assign(myProfile, payload);
      refreshProfileFields(); updateAvatarUI(); closeModal('profileModal'); showToast('✅ Profil kaydedildi!'); loadPins();
    }

    function openCreatePin(fromGhost = false) {
      if (!isFounder()) {
        const last24hCutoff = Date.now() - 24 * 3600 * 1000;
        const myRecentPins = allPins.filter(p => p.user_id === currentUser.id && !p.is_sponsored && new Date(p.created_at).getTime() > last24hCutoff);
        if (myRecentPins.length >= 3) {
          return showToast('⚠️ Son 24 saatte en fazla 3 paylaşım yapabilirsin (harita yoğunluğunu korumak için).');
        }
        const latest = myRecentPins[0];
        if (latest) {
          const minsAgo = (Date.now() - new Date(latest.created_at).getTime()) / 60000;
          if (minsAgo < 3) {
            return showToast(`⏳ Yeni bir paylaşım için ${Math.ceil(3 - minsAgo)} dakika bekle.`);
          }
        }
      }

      selectedCoords = fromGhost ? selectedCoords : (map ? [map.getCenter().lat, map.getCenter().lng] : userCoords);
      document.getElementById('ghostFields').style.display = (ghostMode && isFounder()) ? 'block' : 'none';

    async function toggleAudioRecord() {
      const btn = document.getElementById('audioBtn');
      if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); btn.classList.remove('recording'); btn.textContent = '✅ Audio Ready'; return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = []; mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => { recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' }); const aud = document.getElementById('audioPreview'); aud.src = URL.createObjectURL(recordedAudioBlob); aud.style.display = 'block'; stream.getTracks().forEach(t => t.stop()); };
        mediaRecorder.start(); btn.classList.add('recording'); btn.textContent = '⏹️ Stop';
      } catch (err) { showToast(err.message); }
    }

    async function loadPins() {

    /* Parlak Gold Sponsor Bayrağı + Önemli/Popüler Pin Öne Çıkarma + Yığılmayan Dinamik Kümeleme */
    function renderPins() {
      if (!markersLayer) return;
      markersLayer.clearLayers();
      const filtered = currentFilter === 'all' ? allPins :
        (currentFilter === 'sponsored' ? allPins.filter(p => p.is_sponsored) : allPins.filter(p => p.category === currentFilter));

      const z = map ? map.getZoom() : 14;
      const clusterRadiusKm = z <= 12 ? 1.2 : (z === 13 ? 0.7 : (z === 14 ? 0.38 : (z === 15 ? 0.18 : 0.07)));

      // Sadece kurucu tarafından oluşturulan sponsorlu bayrakları parlak altın olarak çiz
      const sponsoredPins = filtered.filter(p => p.is_sponsored && p.user_id && p.user_id.toLowerCase() === FOUNDER_EMAIL.toLowerCase() || (p.is_sponsored && isFounder()));
      const allSponsored = filtered.filter(p => p.is_sponsored);
      const regularPins = filtered.filter(p => !p.is_sponsored);

      allSponsored.forEach(pin => {
        const label = esc(pin.sponsor_title || pin.ghost_author_name || 'Sponsorlu Mekan');
        const flagIcon = L.divIcon({
          className: '',
          html: `<div class="venue-flag-pin" style="filter:drop-shadow(0 0 12px rgba(255,215,0,0.85));">
            <div class="venue-flag-banner" style="background:linear-gradient(135deg,#fff078 0%,#ffd700 45%,#f59e0b 100%); color:#0f172a; border:2.5px solid #ffffff; max-width:136px; overflow:hidden; text-overflow:ellipsis; display:block; font-weight:900;">🚩 ${label}</div>
            <div class="venue-flag-pole" style="width:3.5px; height:14px; background:#ffd700; border:1px solid #fff;"></div>
          </div>`,
          iconSize: [140, 44], iconAnchor: [16, 44]
        });
        const marker = L.marker([pin.latitude, pin.longitude], { icon: flagIcon, zIndexOffset: 900 });
        marker.on('click', () => openPinDetail(pin));
        markersLayer.addLayer(marker);
      });

      // Yakın pinleri grupla ve her küme içinde en önemli/popüler pini öne çıkar
      const clusters = [];
      regularPins.forEach(pin => {
        let foundCluster = null;
        for (const c of clusters) {
          if (getDistanceKm(c.lat, c.lng, pin.latitude, pin.longitude) <= clusterRadiusKm) {
            foundCluster = c;
            break;
          }
        }
        if (foundCluster) foundCluster.items.push(pin);
        else clusters.push({ lat: pin.latitude, lng: pin.longitude, items: [pin] });
      });

      clusters.forEach(cluster => {
        cluster.items.sort((a, b) => getPinImportance(b).score - getPinImportance(a).score);
        if (cluster.items.length === 1) {
          const pin = cluster.items[0];
          const imp = getPinImportance(pin);
          const meta = CAT_META[pin.category] || CAT_META.event;
          const badge = imp.hasAlertWord ? '🚨' : (imp.isTrending ? '🔥' : (pin.image_url ? '📷' : (pin.audio_url ? '🎙️' : meta.emoji)));
          const sizeStyle = imp.isTrending ? 'width:48px; height:48px; box-shadow:0 0 18px rgba(255,123,57,0.85); border:3px solid #fde047;' : '';
          const icon = L.divIcon({
            className: '',
            html: `<div class="vibe-marker" style="background:${imp.hasAlertWord ? '#ef4444' : meta.color}; ${sizeStyle}"><span>${badge}</span></div>`,
            iconSize: [imp.isTrending ? 48 : 42, imp.isTrending ? 48 : 42],
            iconAnchor: [imp.isTrending ? 24 : 21, imp.isTrending ? 48 : 42]
          });
          const marker = L.marker([pin.latitude, pin.longitude], { icon, zIndexOffset: imp.isTrending ? 700 : 400 });
          marker.on('click', () => openPinDetail(pin));
          markersLayer.addLayer(marker);
        } else {
          const count = cluster.items.length;
          const hasHot = cluster.items.some(p => getPinImportance(p).isTrending);
          const clusterIcon = L.divIcon({
            className: '',
            html: `<div class="cluster-pin" style="${hasHot ? 'background:linear-gradient(135deg,#ef4444,#ff7b39); border-color:#fde047;' : ''}"><span style="font-size:12px;">${hasHot ? '🔥' : '📍'}</span><span style="font-size:12px;">+${count}</span></div>`,
            iconSize: [46, 46], iconAnchor: [23, 23]
          });
          const marker = L.marker([cluster.lat, cluster.lng], { icon: clusterIcon, zIndexOffset: hasHot ? 650 : 450 });
          marker.on('click', () => openClusterModal(cluster.items));
          markersLayer.addLayer(marker);
        }
      });
    }

      document.getElementById('clusterTitle').textContent = `📍 Bu Bölgede ${items.length} Paylaşım Var`;
      const box = document.getElementById('clusterListContainer');

          <div style="min-width:0;">

    async function openPinDetail(pin) {
      activePin = pin;
      await loadBlockedUsers();
      const hideAvatar = blockedIds.includes(pin.user_id) || blockedByIds.includes(pin.user_id);
      const isGhostPin = !!pin.ghost_author_name;

      const effectiveDemo = isGhostPin ? { gender: pin.ghost_gender, age: pin.ghost_age } : pin.profiles;
      const demoHtml = (hideAvatar || pin.is_sponsored) ? '' : renderDemoBadge(effectiveDemo);

      let avHtml = '';

      else avHtml = pin.profiles?.avatar_url ? `<img src="${esc(pin.profiles.avatar_url)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;" />` : `<span>${esc(pin.profiles?.avatar_emoji || '🦊')}</span>`;

      document.getElementById('detailAuthor').innerHTML = `${avHtml} <span>${esc(author)}</span>${demoHtml}`;
      const tScore = pin.profiles?.trust_score ?? 100;

      document.getElementById('detailLikes').textContent = pin.likes_count || 0;
      document.getElementById('detailUpvotes').textContent = pin.upvotes_count || 1;

      const isMine = (pin.user_id && pin.user_id === currentUser.id);

        const { data: rels } = await sb.from('friendships').select('status')
          .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${pin.user_id}),and(sender_id.eq.${pin.user_id},receiver_id.eq.${currentUser.id})`)
          .order('created_at', { ascending: false }).limit(1);

        else if (st === 'accepted') { friendBtn.textContent = t('friends_badge'); friendBtn.style.background = '#059669'; friendBtn.disabled = true; }

    async function sendFriendRequest() {
      if (!activePin || !activePin.user_id) return;
      const btn = document.getElementById('addFriendBtn');
      if (btn.disabled) return;
      btn.disabled = true;

      const { data: existing } = await sb.from('friendships').select('status')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activePin.user_id}),and(sender_id.eq.${activePin.user_id},receiver_id.eq.${currentUser.id})`)
        .in('status', ['pending', 'accepted']);
      if (existing && existing.length > 0) { btn.textContent = existing[0].status === 'accepted' ? t('friends_badge') : t('req_sent'); btn.style.background = '#475569'; return; }

      const sentCount = myProfile.friend_requests_sent || 0;
      const allowedLimit = 10 + extraFriendQuota;
      if (sentCount >= allowedLimit && !hasVipAccess()) {
        btn.disabled = false;
        if (extraFriendQuota < 3) { openAdForFriend(); return; }
        showToast('⚠️ Maksimum arkadaşlık isteği sınırına (10 + 3 reklam hakkı) ulaştınız.');
        return;
      }

      const targetName = activePin.ghost_author_name || activePin.profiles?.username || 'User';
      const { error } = await sb.from('friendships').insert([{ sender_id: currentUser.id, receiver_id: activePin.user_id, sender_name: myProfile.username, receiver_name: targetName, status: 'pending' }]);
      if (error) { btn.disabled = false; return showToast(error.message); }

      btn.textContent = t('req_sent'); btn.style.background = '#475569'; btn.style.opacity = '0.7';
      myProfile.friend_requests_sent = sentCount + 1;
      await sb.from('profiles').update({ friend_requests_sent: myProfile.friend_requests_sent }).eq('id', currentUser.id);
      showToast(`📨 ${targetName}`);
    }

    async function checkNotifications() {
      if (!currentUser) return;
      await loadBlockedUsers();
      const [{ data: fData }, { data: mData }, { data: nData }] = await Promise.all([
        sb.from('friendships').select('id, sender_id').eq('receiver_id', currentUser.id).eq('status', 'pending'),
        sb.from('direct_messages').select('id, sender_id').eq('receiver_id', currentUser.id).eq('is_read', false),
        sb.from('notifications').select('id').eq('user_id', currentUser.id).eq('is_read', false)
      ]);
      const validFriends = (fData || []).filter(f => !blockedIds.includes(f.sender_id) && !blockedByIds.includes(f.sender_id));
      const validMsgs = (mData || []).filter(m => !blockedIds.includes(m.sender_id) && !blockedByIds.includes(m.sender_id));
      const chatUnread = validFriends.length + validMsgs.length;
      const bellUnread = (nData || []).length;

      if (chatUnread + bellUnread > lastUnreadCount) playNotifSound();
      lastUnreadCount = chatUnread + bellUnread;
      document.getElementById('notifDot').style.display = chatUnread > 0 ? 'block' : 'none';
      document.getElementById('bellDot').style.display = bellUnread > 0 ? 'block' : 'none';
    }

    function switchWaTab(tab) { waTab = tab; document.getElementById('tabChats').classList.toggle('active', tab === 'chats'); document.getElementById('tabRequests').classList.toggle('active', tab === 'requests'); document.getElementById('tabBlocked').classList.toggle('active', tab === 'blocked'); document.getElementById('waSearchWrap').style.display = (tab === 'chats') ? 'block' : 'none'; renderWaChatList(); }
    function openFriendsModal() { openModal('friendsModal'); refreshFriendsData(); if (listPollTimer) clearInterval(listPollTimer); listPollTimer = setInterval(refreshFriendsData, 2500); }
    function closeFriendsModal() { if (listPollTimer) { clearInterval(listPollTimer); listPollTimer = null; } closeModal('friendsModal'); }

    async function refreshFriendsData() {
      if (!currentUser) return;
      await loadBlockedUsers();
      const [{ data: fShips }, { data: msgs }] = await Promise.all([
        sb.from('friendships').select('*').or(`receiver_id.eq.${currentUser.id},sender_id.eq.${currentUser.id}`).order('created_at', { ascending: false }),
        sb.from('direct_messages').select('*').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`).order('created_at', { ascending: false })
      ]);

      const accepted = (fShips || []).filter(f => { if (f.status !== 'accepted') return false; const otherId = f.sender_id === currentUser.id ? f.receiver_id : f.sender_id; return !blockedIds.includes(otherId); });
      waIncomingCache = (fShips || []).filter(f => f.receiver_id === currentUser.id && f.status === 'pending' && !blockedIds.includes(f.sender_id));
      waResponsesCache = (fShips || []).filter(f => f.sender_id === currentUser.id && f.status !== 'pending' && !blockedIds.includes(f.receiver_id));
      document.getElementById('reqCountBadge').textContent = waIncomingCache.length > 0 ? `(${waIncomingCache.length})` : '';

      const friendIds = accepted.map(f => f.sender_id === currentUser.id ? f.receiver_id : f.sender_id);
      const allProfileIds = [...new Set([...friendIds, ...blockedIds])];
      let profilesMap = {};
      if (allProfileIds.length > 0) {
        const { data: profs } = await sb.from('profiles').select('id, username, avatar_emoji, avatar_url, gender, age, birth_date').in('id', allProfileIds);
        (profs || []).forEach(p => { profilesMap[p.id] = p; });
      }

      waBlockedCache = blockedIds.map(bid => ({ blocked_id: bid, profile: profilesMap[bid] || null, name: profilesMap[bid]?.username || `User (${bid.slice(0,6)})` }));

      waFriendsCache = accepted.map(f => {
        const isSender = (f.sender_id === currentUser.id);
        const friendId = isSender ? f.receiver_id : f.sender_id;
        const isBlockedByThem = blockedByIds.includes(friendId);
        const prof = profilesMap[friendId];
        const liveName = prof?.username || (isSender ? f.receiver_name : f.sender_name) || 'Vibe User';
        const ghostAlias = (!isSender && f.receiver_name && f.receiver_name !== myProfile.username) ? f.receiver_name : null;

        const dbThread = (msgs || []).filter(m => (m.sender_id === friendId && m.receiver_id === currentUser.id) || (m.sender_id === currentUser.id && m.receiver_id === friendId));
        const localThread = localUndeliveredMsgs.filter(m => m.receiver_id === friendId);
        const merged = [...localThread, ...dbThread].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        const lastMsg = merged[0] || null;
        const unreadCount = dbThread.filter(m => m.sender_id === friendId && !m.is_read).length;

        return { friendshipId: f.id, friendId, name: liveName, ghostAlias, profile: prof, lastMsg, unreadCount, isBlockedByThem };
      }).sort((a, b) => (b.lastMsg ? new Date(b.lastMsg.created_at).getTime() : 0) - (a.lastMsg ? new Date(a.lastMsg.created_at).getTime() : 0));

      renderWaChatList();
    }

    function renderWaChatList() {
      const box = document.getElementById('waListContainer');
      if (waTab === 'chats') {
        const q = (document.getElementById('waSearchInput').value || '').toLowerCase();
        const list = waFriendsCache.filter(item => item.name.toLowerCase().includes(q));
        if (list.length === 0) { box.innerHTML = `<div style="padding:40px 20px; text-align:center; color:#8696a0; font-size:13.5px;">${t('start_chat_hint')}</div>`; return; }
        box.innerHTML = list.map(item => {
          const isTyping = !item.isBlockedByThem && !!typingUsersMap[item.friendId];
          const tickPrefix = item.lastMsg && item.lastMsg.sender_id === currentUser.id ? (item.lastMsg.undelivered ? '✓ ' : '✓✓ ') : '';
          const preview = isTyping ? `<span style="color:var(--wa-green); font-weight:700;">${t('typing_txt')}</span>` : (item.lastMsg ? tickPrefix + esc(item.lastMsg.message_text) : t('start_chat_hint'));
          const timeStr = item.lastMsg ? formatTime(item.lastMsg.created_at) : '';
          const badgeHtml = item.unreadCount > 0 ? `<span class="wa-badge">${item.unreadCount}</span>` : '';
          const demoHtml = item.isBlockedByThem ? '' : renderDemoBadge(item.profile);
          const ghostTag = item.ghostAlias ? `<span style="font-size:10px; background:rgba(236,72,153,0.2); color:#f472b6; padding:1px 6px; border-radius:999px; margin-left:4px;">👻 ${esc(item.ghostAlias)}</span>` : '';
          return `<div class="wa-chat-row" onclick="openDirectChat('${item.friendId}')">
            <div class="wa-avatar">${avatarHtml(item.profile, '🦊', item.isBlockedByThem)}</div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; gap:6px;">
                <span style="font-size:15px; font-weight:700; color:#e9edef; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(item.name)}${demoHtml}${ghostTag}</span>
                <span style="font-size:11px; color:${item.unreadCount > 0 ? 'var(--wa-green)' : '#8696a0'}; flex-shrink:0;">${timeStr}</span>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <span style="font-size:13px; color:#8696a0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${preview}</span>
                ${badgeHtml}
              </div>
            </div>
          </div>`;
        }).join('');
      } else if (waTab === 'requests') {
        if (waIncomingCache.length === 0 && waResponsesCache.length === 0) { box.innerHTML = '<div style="padding:40px 20px; text-align:center; color:#8696a0; font-size:13.5px;">—</div>'; return; }
        box.innerHTML = waIncomingCache.map(f => {
          const targetPersona = (f.receiver_name && f.receiver_name !== myProfile.username) ? ` <span style="color:#f472b6; font-size:11px;">(👻 ${esc(f.receiver_name)} karakterine)</span>` : '';
          return `<div class="wa-chat-row" style="cursor:default;"><div class="wa-avatar">👤</div><div style="flex:1;"><div style="font-size:14.5px; font-weight:700; color:#e9edef;">${esc(f.sender_name || 'Vibe User')}${targetPersona}</div></div><div style="display:flex; gap:6px;"><button onclick="respondFriend('${f.id}','accepted')" style="padding:7px 12px; border-radius:999px; border:none; background:var(--wa-green); color:#111b21; font-weight:800; font-size:12px; cursor:pointer;">✓</button><button onclick="respondFriend('${f.id}','rejected')" style="padding:7px 11px; border-radius:999px; border:none; background:#2a3942; color:#f87171; font-weight:700; font-size:12px; cursor:pointer;">✕</button></div></div>`;
        }).join('');
      } else {
        if (waBlockedCache.length === 0) { box.innerHTML = '<div style="padding:40px 20px; text-align:center; color:#8696a0; font-size:13.5px;">—</div>'; return; }
        box.innerHTML = waBlockedCache.map(b => `<div class="wa-chat-row" style="cursor:default;"><div class="wa-avatar">${avatarHtml(null, '🚫', true)}</div><div style="flex:1;"><div style="font-size:14.5px; font-weight:700; color:#e9edef;">${esc(b.name)}</div></div><button onclick="unblockUser('${b.blocked_id}')" style="padding:7px 12px; border-radius:999px; border:none; background:var(--wa-green); color:#111b21; font-weight:800; font-size:12px; cursor:pointer;">Engeli Kaldır</button></div>`).join('');
      }
    }

    async function respondFriend(id, status) { await sb.from('friendships').update({ status }).eq('id', id); checkNotifications(); refreshFriendsData(); }
    async function unblockUser(targetUserId) {
      await sb.from('blocked_users').delete().eq('blocker_id', currentUser.id).eq('blocked_id', targetUserId);
      blockedIds = blockedIds.filter(id => id !== targetUserId);
      localUndeliveredMsgs = localUndeliveredMsgs.filter(m => m.receiver_id !== targetUserId);
      loadPins(); await refreshFriendsData(); switchWaTab('chats');
    }
    function toggleWaMenu() { const m = document.getElementById('waChatMenu'); m.style.display = (m.style.display === 'block') ? 'none' : 'block'; }
    async function removeCurrentChatFriend() { document.getElementById('waChatMenu').style.display = 'none'; if (!activeChatFriend || !activeChatFriend.friendshipId) return; await sb.from('friendships').delete().eq('id', activeChatFriend.friendshipId); backToChats(); }
    async function blockCurrentChatFriend() { document.getElementById('waChatMenu').style.display = 'none'; if (!activeChatFriend) return; if (!blockedIds.includes(activeChatFriend.id)) { await sb.from('blocked_users').insert([{ blocker_id: currentUser.id, blocked_id: activeChatFriend.id }]); blockedIds.push(activeChatFriend.id); } loadPins(); backToChats(); }
    function backToChats() { closeChatModal(); openFriendsModal(); }

    async function openDirectChat(friendId) {
      await loadBlockedUsers();
      const cached = waFriendsCache.find(x => x.friendId === friendId);
      let prof = cached?.profile;
      if (!prof) { const { data } = await sb.from('profiles').select('id, username, avatar_emoji, avatar_url, gender, age, birth_date').eq('id', friendId).single(); prof = data; }
      const hideAvatar = blockedIds.includes(friendId) || blockedByIds.includes(friendId);
      const liveName = prof?.username || cached?.name || 'Vibe User';
      activeChatFriend = { id: friendId, name: liveName, ghostAlias: cached?.ghostAlias || null, profile: prof, friendshipId: cached?.friendshipId || null };

      const ghostLabel = activeChatFriend.ghostAlias ? ` <span style="font-size:10.5px; color:#f472b6; margin-left:4px;">(👻 ${esc(activeChatFriend.ghostAlias)})</span>` : '';
      document.getElementById('chatFriendTitle').innerHTML = `<span>${esc(liveName)}</span>${hideAvatar ? '' : renderDemoBadge(prof)}${ghostLabel}`;
      document.getElementById('chatHeaderAvatar').innerHTML = avatarHtml(prof, '🦊', hideAvatar);
      document.getElementById('waChatMenu').style.display = 'none';
      updateTypingIndicators();

      closeFriendsModal(); openModal('chatModal'); loadDirectMessages();
      if (chatPollTimer) clearInterval(chatPollTimer);
      chatPollTimer = setInterval(loadDirectMessages, 2000);
    }

    function closeChatModal() { if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; } activeChatFriend = null; closeModal('chatModal'); checkNotifications(); }

    async function loadDirectMessages() {
      if (!activeChatFriend || !currentUser) return;
      await loadBlockedUsers();
      const hideAvatar = blockedIds.includes(activeChatFriend.id) || blockedByIds.includes(activeChatFriend.id);
      document.getElementById('chatHeaderAvatar').innerHTML = avatarHtml(activeChatFriend.profile, '🦊', hideAvatar);
      updateTypingIndicators();

      const box = document.getElementById('chatMessagesBox');
      const { data } = await sb.from('direct_messages').select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChatFriend.id}),and(sender_id.eq.${activeChatFriend.id},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });
      const hasUnreadFromFriend = !hideAvatar && (data || []).some(m => m.sender_id === activeChatFriend.id && !m.is_read);
      if (hasUnreadFromFriend) {
        playNotifSound();
        await sb.from('direct_messages').update({ is_read: true }).eq('sender_id', activeChatFriend.id).eq('receiver_id', currentUser.id).eq('is_read', false);
      }

      const localMsgs = localUndeliveredMsgs.filter(m => m.receiver_id === activeChatFriend.id);
      const allThread = [...(data || []), ...localMsgs].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

      box.innerHTML = allThread.length === 0
        ? '<div style="background:rgba(32,44,51,0.85); color:#8696a0; font-size:12px; padding:8px 14px; border-radius:10px; text-align:center; margin:auto;">🔒 End-to-end protected chat</div>'
        : allThread.map(m => {
            const isMine = (m.sender_id === currentUser.id);
            let ticks = isMine ? (m.undelivered ? `<span style="color:rgba(233,237,239,0.65); font-weight:800;">✓</span>` : `<span style="color:${m.is_read ? '#53bdeb' : 'rgba(233,237,239,0.65)'}; font-weight:800;">✓✓</span>`) : '';
            return `<div class="wa-bubble ${isMine ? 'wa-mine' : 'wa-theirs'}"><div>${esc(m.message_text)}</div><div class="wa-meta"><span>${formatTime(m.created_at)}</span>${ticks}</div></div>`;
          }).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function sendDirectMessage() {
      const input = document.getElementById('dmInput'), text = input.value.trim();
      if (!text || !activeChatFriend || !currentUser) return;
      await loadBlockedUsers();
      if (blockedIds.includes(activeChatFriend.id)) return showToast('🚫 Bu kullanıcıyı engelledin.');
      input.value = '';
      if (blockedByIds.includes(activeChatFriend.id)) {
        localUndeliveredMsgs.push({ sender_id: currentUser.id, receiver_id: activeChatFriend.id, message_text: text, created_at: new Date().toISOString(), is_read: false, undelivered: true });
        loadDirectMessages(); return;
      }
      const { error } = await sb.from('direct_messages').insert([{ sender_id: currentUser.id, receiver_id: activeChatFriend.id, message_text: text }]);
      if (error) return showToast(error.message);
      loadDirectMessages();
    }

    async function submitSupportTicket() {
      const category = document.getElementById('supportCat').value, message = document.getElementById('supportMsg').value.trim();
      if (!message) return;
      const { error } = await sb.from('support_tickets').insert([{ user_id: currentUser?.id, user_email: currentUser?.email, category, message }]);
      if (error) return showToast(error.message);
      document.getElementById('supportMsg').value = ''; closeModal('supportModal'); showToast('📨 Sent!');
    }

    async function openAdminTickets() {
      closeModal('profileModal'); openModal('adminTicketsModal');
      const { data } = await sb.from('support_tickets').select('*').order('created_at', { ascending: false });
      const box = document.getElementById('ticketsContainer');
      box.innerHTML = (!data || data.length === 0) ? '<div style="color:var(--muted); font-size:13px;">No tickets yet.</div>' :
        data.map(t => `<div style="padding:12px; border-radius:14px; background:rgba(255,255,255,0.05); margin-bottom:10px; border:1px solid var(--border);">
          <div style="font-size:11px; color:var(--accent); font-weight:700; margin-bottom:4px;">[${esc(t.category.toUpperCase())}] ${esc(t.user_email || 'Anon')}</div>
          <div style="font-size:13px; line-height:1.4;">${esc(t.message)}</div>
        </div>`).join('');
    }

    async function loadComments(pinId) {
      const list = document.getElementById('commentsList');
      const { data } = await sb.from('pin_comments').select('*, profiles(username, gender, age, birth_date)').eq('pin_id', pinId).order('created_at', { ascending: true });
      list.innerHTML = (!data || data.length === 0) ? '<div style="color:var(--muted); font-size:12px;">—</div>' : data.map(c => `<div style="padding:8px; border-radius:10px; background:rgba(255,255,255,0.04); margin-bottom:6px; font-size:13px;"><strong>${esc(c.profiles?.username || 'User')}</strong>${renderDemoBadge(c.profiles)}: ${esc(c.comment_text)}</div>`).join('');
    }

    async function submitComment() {
      const input = document.getElementById('commentInput'), text = input.value.trim();
      if (!text || !activePin || !currentUser) return;
      const { error } = await sb.from('pin_comments').insert([{ pin_id: activePin.id, user_id: currentUser.id, comment_text: text }]);
      if (!error) {
        input.value = ''; loadComments(activePin.id);
        if (activePin.user_id && activePin.user_id !== currentUser.id) {
          await sb.from('notifications').insert([{ user_id: activePin.user_id, type: 'pin_comment', title: '💬 Paylaşımına Yeni Yorum!', body: `${myProfile.username}: ${text.slice(0, 60)}`, pin_id: activePin.id }]);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
