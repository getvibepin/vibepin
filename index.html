<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>VibePin — Canlı Konum & Sosyal Harita</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: rgba(19, 24, 36, 0.92);
      --border: rgba(255, 255, 255, 0.12);
      --primary: #7c3aed;
      --accent: #06b6d4;
      --pink: #ec4899;
      --amber: #f59e0b;
      --green: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    #map { width: 100%; height: 100%; z-index: 1; }
    .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
    .leaflet-control-attribution { display: none !important; }

    /* Üst Bar */
    .top-bar {
      position: fixed; top: 14px; left: 14px; right: 14px; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }
    .pill {
      background: var(--panel); backdrop-filter: blur(14px);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 8px 14px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45); font-size: 13px; font-weight: 600;
    }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--panel); backdrop-filter: blur(14px); color: var(--text);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.45); transition: transform 0.15s;
    }
    .icon-btn:active { transform: scale(0.92); }
    .ghost-active { border-color: var(--pink); box-shadow: 0 0 16px rgba(236, 72, 153, 0.55); background: rgba(236, 72, 153, 0.2); }

    select.city-select {
      background: transparent; border: none; color: var(--text); font-weight: 700;
      font-size: 13px; outline: none; max-width: 155px;
    }
    select.city-select option { background: #131824; color: #fff; }

    /* Kategori Filtreleri */
    .filter-row {
      position: fixed; top: 66px; left: 14px; right: 14px; z-index: 999;
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
      padding: 6px 12px; font-size: 12px; font-weight: 600; white-space: nowrap;
      color: var(--muted); cursor: pointer; backdrop-filter: blur(10px);
    }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Alt Aksiyon Çubuğu */
    .bottom-bar {
      position: fixed; bottom: 22px; left: 16px; right: 16px; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      pointer-events: none;
    }
    .bottom-bar > * { pointer-events: auto; }
    .fab-main {
      flex: 1; height: 54px; border-radius: 999px; border: none;
      background: linear-gradient(135deg, var(--primary), var(--pink));
      color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 0.3px;
      box-shadow: 0 10px 28px rgba(124, 58, 237, 0.55); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .fab-main:active { transform: scale(0.97); }

    /* Özel Pin İkonu */
    .vibe-marker {
      width: 44px; height: 44px; border-radius: 50% 50% 50% 4px;
      transform: rotate(-45deg); display: flex; align-items: center; justify-content: center;
      border: 2.5px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    .vibe-marker span { transform: rotate(45deg); font-size: 20px; }

    /* Modal / Çekmece */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 2000;
      display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px);
    }
    .modal-backdrop.open { display: flex; }
    .sheet {
      width: 100%; max-width: 480px; background: #131824;
      border-top: 1px solid var(--border); border-radius: 24px 24px 0 0;
      padding: 20px 20px 32px; max-height: 88vh; overflow-y: auto;
      animation: slideUp 0.22s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .sheet-title { font-size: 17px; font-weight: 800; }
    .close-btn { background: rgba(255,255,255,0.08); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; }

    .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .cat-opt {
      padding: 10px; border-radius: 14px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.03); color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px;
    }
    .cat-opt.selected { border-color: var(--accent); background: rgba(6, 182, 212, 0.16); }

    textarea, input {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; color: #fff; font-size: 14px; outline: none; margin-bottom: 12px;
    }
    .btn-primary {
      width: 100%; padding: 13px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .btn-secondary {
      width: 100%; padding: 11px; border-radius: 14px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.06); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(16,185,129,0.18); color: var(--green); font-weight: 700; }
