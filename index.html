<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VibePin — Canlı Konum & Sosyal Harita</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#090c12" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root { --bg:#090c12; --panel:rgba(17,22,33,0.92); --border:rgba(255,255,255,0.1); --primary:#7c3aed; --accent:#06b6d4; --pink:#ec4899; --green:#10b981; --danger:#ef4444; --text:#f8fafc; --muted:#94a3b8; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body, html { width:100%; height:100%; background:var(--bg); color:var(--text); overflow:hidden; }
    #map { width:100%; height:100%; z-index:1; background:#090c12; }
    .dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(82%) contrast(88%) saturate(35%); }
    .leaflet-control-attribution { display:none !important; }
    #authGate { position:fixed; inset:0; z-index:5000; background:radial-gradient(circle at top,#1e1b4b 0%,#090c12 72%); display:flex; flex-direction:column; justify-content:space-between; padding:36px 24px 24px; overflow-y:auto; }
    .top-bar { position:fixed; top:14px; left:14px; right:14px; z-index:1000; display:flex; align-items:center; justify-content:space-between; gap:8px; pointer-events:none; }
    .top-bar > * { pointer-events:auto; }
    .pill { background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--border); border-radius:999px; padding:8px 13px; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; cursor:pointer; }
    .icon-btn { position:relative; width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:var(--panel); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; overflow:hidden; }
    .icon-btn img { width:100%; height:100%; object-fit:cover; }
    .notif-dot { position:absolute; top:2px; right:2px; width:11px; height:11px; border-radius:50%; background:var(--danger); border:2px solid #090c12; display:none; }
    .ghost-active { border-color:var(--pink); background:rgba(236,72,153,0.25); }
    .filter-row { position:fixed; top:66px; left:14px; right:14px; z-index:999; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
    .chip { background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600; white-space:nowrap; color:var(--muted); cursor:pointer; }
    .chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .bottom-bar { position:fixed; bottom:22px; left:16px; right:16px; z-index:1000; display:flex; align-items:center; justify-content:space-between; gap:12px; pointer-events:none; }
    .bottom-bar > * { pointer-events:auto; }
    .fab-main { flex:1; height:54px; border-radius:999px; border:none; background:linear-gradient(135deg,var(--primary),var(--pink)); color:#fff; font-size:14px; font-weight:800; cursor:pointer; box-shadow:0 8px 24px rgba(124,58,237,0.4); }
    .vibe-marker { width:44px; height:44px; border-radius:50% 50% 50% 4px; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; border:2.5px solid #fff; box-shadow:0 6px 16px rgba(0,0,0,0.5); }
    .vibe-marker span { transform:rotate(45deg); font-size:19px; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,
  <script>
    const FOUNDER_EMAIL = 'getvibepin@gmail.com';
    const SUPA_URL = 'https://xotxhjckccwvddahdvxo.supabase.co';
    const SUPA_KEY = 'sb_publishable_ZXCOMpaIBJJYQnASuBJqGA_uYPM3tXA';
    let sb = null, map = null, userCoords = [41.0082, 28.9784], selectedCoords = null, currentFilter = 'all', selectedCategory = 'event', ghostMode = false, currentUser = null;
    let myProfile = { username: 'Vibe Üyesi', avatar_emoji: '🦊', avatar_url: null }, activePin = null, allPins = [], markersLayer = null;
    let selectedPhotoFile = null, selectedAvatarFile = null, mediaRecorder = null, audioChunks = [], recordedAudioBlob = null, teleportUnlocked = false, teleportPickMode = false;
    let activeChatFriend = null, chatPollTimer = null;
    const CAT_META = { event: { emoji: '🎉', color: '#ec4899' }, social: { emoji: '☕', color: '#06b6d4' }, question: { emoji: '❓', color: '#f59e0b' }, deal: { emoji: '⚡', color: '#10b981' } };

    function esc(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 3500); }
    function isFounder() { return currentUser && currentUser.email && currentUser.email.toLowerCase() === FOUNDER_EMAIL.toLowerCase(); }

    function initApp() {
      const status = document.getElementById('loginStatus');
      if (!window.supabase) { status.textContent = 'Bağlantı kütüphanesi yüklenemedi, sayfayı yenileyin.'; return; }
      sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'vibepin_auth_v4' }
      });

      document.getElementById('googleLoginBtn').addEventListener('click', signInWithGoogle);
      document.getElementById('loginBtn').addEventListener('click', gateSignIn);
      document.getElementById('signupBtn').addEventListener('click', gateSignUp);

      if (window.L) {
        map = L.map('map', { zoomControl: false }).setView(userCoords, 15);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'dark-tiles' }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
        map.on('click', (e) => {
          if (teleportPickMode) {
            teleportPickMode = false;
            userCoords = [e.latlng.lat, e.latlng.lng];
            map.flyTo(userCoords, 15);
            showToast('🌍 Seçtiğin konuma ışınlandın!');
            return;
          }
          if (ghostMode && isFounder()) { selectedCoords = [e.latlng.lat, e.latlng.lng]; openCreatePin(true); }
        });
      }

      sb.auth.onAuthStateChange((_event, session) => {
        if (session?.user) { enterApp(session.user); }
      });
      checkSession();
    }

    async function enterApp(user) {
      currentUser = user;
      document.getElementById('authGate').style.display = 'none';
      document.getElementById('ghostBtn').style.display = isFounder() ? 'flex' : 'none';
      if (map) setTimeout(() => map.invalidateSize(), 200);
      await loadMyProfile();
      locateUser(); loadPins(); checkNotifications();
    }

    async function checkSession() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session?.user) { await enterApp(session.user); }
        else { document.getElementById('authGate').style.display = 'flex'; }
      } catch (e) { document.getElementById('authGate').style.display = 'flex'; }
    }

    async function signInWithGoogle() {
      const status = document.getElementById('loginStatus');
      status.style.color = '#38bdf8';
      status.textContent = 'Google hesabına yönlendiriliyor...';
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) { status.style.color = '#f87171'; status.textContent = 'Google giriş hatası: ' + error.message; }
    }

    async function gateSignIn() {
      const btn = document.getElementById('loginBtn'), status = document.getElementById('loginStatus');
      const email = document.getElementById('gateEmail').value.trim(), password = document.getElementById('gatePass').value.trim();
      if (!email || !password) { status.textContent = 'Lütfen e-posta ve şifrenizi girin.'; return; }
      btn.textContent = '⏳...'; btn.disabled = true; status.style.color = '#38bdf8'; status.textContent = 'Giriş yapılıyor...';
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      btn.textContent = '🔐 Giriş Yap'; btn.disabled = false;
      if (error) { status.style.color = '#f87171'; status.textContent = 'Giriş hatası: ' + error.message; return; }
      status.textContent = ''; showToast('✅ Hoş geldin!'); await enterApp(data.user);
    }

    async function gateSignUp() {
      const btn = document.getElementById('signupBtn'), status = document.getElementById('loginStatus');
      const email = document.getElementById('gateEmail').value.trim(), password = document.getElementById('gatePass').value.trim();
      if (!email || password.length < 6) { status.textContent = 'E-posta ve en az 6 haneli şifre girin.'; return; }
      btn.textContent = '⏳...'; btn.disabled = true; status.style.color = '#38bdf8'; status.textContent = 'Hesap oluşturuluyor...';
      const { data, error } = await sb.auth.signUp({ email, password });
      btn.textContent = '✨ Kayıt Ol'; btn.disabled = false;
      if (error) { status.style.color = '#f87171'; status.textContent = 'Kayıt hatası: ' + error.message; return; }
      if (data.session) { showToast('🎉 Kayıt tamamlandı!'); await enterApp(data.user); }
      else { status.style.color = '#10b981'; status.textContent = '✅ Kayıt başarılı! Şimdi Giriş Yap butonuna basabilirsin.'; }
    }

    function updateAvatarUI() {
      const btn = document.getElementById('myAvatarBtn'), prev = document.getElementById('profilePhotoPreview');
      if (myProfile.avatar_url) {
        btn.innerHTML = `<img src="${esc(myProfile.avatar_url)}" />`;
        prev.innerHTML = `<img src="${esc(myProfile.avatar_url)}" style="width:100%;height:100%;object-fit:cover;" />`;
      } else { btn.textContent = myProfile.avatar_emoji || '🦊'; prev.textContent = myProfile.avatar_emoji || '🦊'; }
    }

    async function loadMyProfile() {
      const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
      if (data) { myProfile = data; }
      else {
        const defaultName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
        myProfile = { username: defaultName, avatar_emoji: '🦊', avatar_url: currentUser.user_metadata?.avatar_url || null };
        await sb.from('profiles').upsert({ id: currentUser.id, username: myProfile.username, avatar_emoji: '🦊', avatar_url: myProfile.avatar_url });
      }
      document.getElementById('profileNameInput').value = myProfile.username || '';
      updateAvatarUI();
    }

    function openProfileModal() { selectedAvatarFile = null; openModal('profileModal'); }
    function pickAvatar(emoji, el) { myProfile.avatar_emoji = emoji; myProfile.avatar_url = null; selectedAvatarFile = null; document.querySelectorAll('.av-opt').forEach(a => a.classList.remove('selected')); el.classList.add('selected'); updateAvatarUI(); }
    function handleAvatarFile(input) {
      if (input.files && input.files[0]) {
        selectedAvatarFile = input.files[0];
        document.getElementById('avatarUploadLabel').textContent = '✅ Fotoğraf Seçildi';
        document.getElementById('profilePhotoPreview').innerHTML = `<img src="${URL.createObjectURL(selectedAvatarFile)}" style="width:100%;height:100%;object-fit:cover;" />`;
      }
    }

    async function saveProfile() {
      const name = document.getElementById('profileNameInput').value.trim() || 'Vibe_Üyesi';
      myProfile.username = name;
      if (selectedAvatarFile) {
        const ext = selectedAvatarFile.name.split('.').pop() || 'jpg';
        const path = `${currentUser.id}/avatar_${Date.now()}.${ext}`;
        const { error: upErr } = await sb.storage.from('vibe-media').upload(path, selectedAvatarFile);
        if (!upErr) myProfile.avatar_url = sb.storage.from('vibe-media').getPublicUrl(path).data.publicUrl;
      }
      const { error } = await sb.from('profiles').upsert({ id: currentUser.id, username: name, avatar_emoji: myProfile.avatar_emoji, avatar_url: myProfile.avatar_url });
      if (error) return showToast('Hata: ' + error.message);
      updateAvatarUI(); closeModal('profileModal'); showToast('✅ Profil kaydedildi!');
    }

    function triggerTeleport() {
      if (!teleportUnlocked) { openModal('adModal'); return; }
      teleportPickMode = true; if (map) map.setZoom(6);
      showToast('🗺️ Haritada gitmek istediğin şehre veya sokağa dokun!');
    }

    function startRewardAd() {
      document.getElementById('watchAdBtn').style.display = 'none';
      document.getElementById('adCountdownBox').style.display = 'block';
      let sec = 5;
      const timer = setInterval(() => {
        sec--; document.getElementById('adSec').textContent = sec;
        if (sec <= 0) { clearInterval(timer); teleportUnlocked = true; document.getElementById('teleportBtn').innerHTML = '🌍 Haritadan Seç 🔓'; closeModal('adModal'); triggerTeleport(); }
      }, 1000);
    }

    async function signOutUser() { await sb.auth.signOut(); currentUser = null; closeModal('profileModal'); document.getElementById('authGate').style.display = 'flex'; }
    function locateUser() { if (!navigator.geolocation || !map) return; navigator.geolocation.getCurrentPosition((pos) => { userCoords = [pos.coords.latitude, pos.coords.longitude]; map.flyTo(userCoords, 15); }, () => {}); }
    function toggleGhostMode() { if (!isFounder()) return; ghostMode = !ghostMode; document.getElementById('ghostBtn').classList.toggle('ghost-active', ghostMode); showToast(ghostMode ? '👻 Kurucu Modu Açık: Haritaya dokun!' : 'Kurucu Modu kapatıldı'); }
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function selectCat(cat, el) { selectedCategory = cat; document.querySelectorAll('.cat-opt').forEach(b => b.classList.remove('selected')); el.classList.add('selected'); }
    function setFilter(cat, el) { currentFilter = cat; document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); renderPins(); }

    function openCreatePin(fromGhost = false) {
      if (!fromGhost && map) selectedCoords = [map.getCenter().lat, map.getCenter().lng];
      document.getElementById('ghostFields').style.display = (fromGhost && isFounder()) ? 'block' : 'none';
      selectedPhotoFile = null; recordedAudioBlob = null;
      document.getElementById('photoPreview').style.display = 'none';
      document.getElementById('audioPreview').style.display = 'none';
      document.getElementById('photoLabel').textContent = '📷 Fotoğraf Çek / Seç';
      openModal('createModal');
    }

    function handlePhotoSelect(input) {
      if (input.files && input.files[0]) {
        selectedPhotoFile = input.files[0];
        document.getElementById('photoLabel').textContent = '✅ Fotoğraf Hazır';
        const img = document.getElementById('photoPreview');
        img.src = URL.createObjectURL(selectedPhotoFile); img.style.display = 'block';
      }
    }

    async function toggleAudioRecord() {
      const btn = document.getElementById('audioBtn');
      if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); btn.classList.remove('recording'); btn.textContent = '✅ Ses Kaydedildi'; return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = []; mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const aud = document.getElementById('audioPreview');
          aud.src = URL.createObjectURL(recordedAudioBlob); aud.style.display = 'block';
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start(); btn.classList.add('recording'); btn.textContent = '⏹️ Durdur (Kaydediyor)';
      } catch (err) { showToast('Mikrofon izni verilmedi: ' + err.message); }
    }

    async function submitPin() {
      const text = document.getElementById('pinText').value.trim();
      if (!text && !selectedPhotoFile && !recordedAudioBlob) return showToast('Yazı, fotoğraf veya ses ekleyin');
      const btn = document.getElementById('publishBtn'); btn.textContent = '⏳ Yükleniyor...'; btn.disabled = true;
      let image_url = null, audio_url = null;
      if (selectedPhotoFile) {
        const ext = selectedPhotoFile.name.split('.').pop() || 'jpg';
        const path = `${currentUser.id}/${Date.now()}.${ext}`;
        const { error } = await sb.storage.from('vibe-media').upload(path, selectedPhotoFile);
        if (!error) image_url = sb.storage.from('vibe-media').getPublicUrl(path).data.publicUrl;
      }
      if (recordedAudioBlob) {
        const path = `${currentUser.id}/${Date.now()}.webm`;
        const { error } = await sb.storage.from('vibe-media').upload(path, recordedAudioBlob);
        if (!error) audio_url = sb.storage.from('vibe-media').getPublicUrl(path).data.publicUrl;
      }
      const ghostName = (ghostMode && isFounder()) ? (document.getElementById('ghostNameInput').value.trim() || 'Gezgin_' + Math.floor(Math.random()*99)) : null;
      const [lat, lng] = selectedCoords || userCoords;
      const { error } = await sb.from('pins').insert([{ user_id: currentUser.id, ghost_author_name: ghostName, category: selectedCategory, content_text: text || '📍 Canlı Paylaşım', latitude: lat, longitude: lng, image_url, audio_url }]);
      btn.textContent = '🚀 Haritada Yayınla'; btn.disabled = false;
      if (error) return showToast('Hata: ' + error.message);
      document.getElementById('pinText').value = ''; closeModal('createModal'); showToast('🚀 VibePin yayınlandı!'); loadPins();
    }

    async function loadPins() {
      const { data, error } = await sb.from('pins').select('*, profiles(username, avatar_emoji, avatar_url)').gt('expires_at', new Date().toISOString()).order('created_at', { ascending: false });
      if (!error && data) { allPins = data; renderPins(); }
    }

    function renderPins() {
      if (!markersLayer) return;
      markersLayer.clearLayers();
      const filtered = currentFilter === 'all' ? allPins : allPins.filter(p => p.category === currentFilter);
      filtered.forEach(pin => {
        const meta = CAT_META[pin.category] || CAT_META.event;
        const badge = pin.image_url ? '📷' : (pin.audio_url ? '🎙️' : meta.emoji);
        const icon = L.divIcon({ className: '', html: `<div class="vibe-marker" style="background:${meta.color}"><span>${badge}</span></div>`, iconSize: [44, 44], iconAnchor: [22, 44] });
        const marker = L.marker([pin.latitude, pin.longitude], { icon });
        marker.on('click', () => openPinDetail(pin));
        markersLayer.addLayer(marker);
      });
    }

    async function openPinDetail(pin) {
      activePin = pin;
      const author = pin.ghost_author_name || pin.profiles?.username || 'Vibe Kullanıcısı';
      const avHtml = (!pin.ghost_author_name && pin.profiles?.avatar_url)
        ? `<img src="${esc(pin.profiles.avatar_url)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;" />`
        : `<span>${esc(pin.profiles?.avatar_emoji || '🦊')}</span>`;
      document.getElementById('detailAuthor').innerHTML = `${avHtml} <span>${esc(author)}</span>`;
      document.getElementById('detailText').textContent = pin.content_text;
      document.getElementById('detailUpvotes').textContent = pin.upvotes_count || 1;
      const isMine = (pin.user_id && pin.user_id === currentUser.id);
      document.getElementById('addFriendBtn').style.display = (pin.user_id && !isMine) ? 'block' : 'none';
      document.getElementById('deletePinBtn').style.display = isMine ? 'block' : 'none';
      const img = document.getElementById('detailImg'), aud = document.getElementById('detailAudio');
      if (pin.image_url) { img.src = pin.image_url; img.style.display = 'block'; } else { img.style.display = 'none'; }
      if (pin.audio_url) { aud.src = pin.audio_url; aud.style.display = 'block'; } else { aud.style.display = 'none'; }
      openModal('detailModal'); loadComments(pin.id);
    }

    async function deleteCurrentPin() {
      if (!activePin || !currentUser) return;
      const { error } = await sb.from('pins').delete().eq('id', activePin.id).eq('user_id', currentUser.id);
      if (error) return showToast('Silme hatası: ' + error.message);
      closeModal('detailModal'); showToast('🗑️ Paylaşımın silindi!'); loadPins();
    }

    async function sendFriendRequest() {
      if (!activePin || !activePin.user_id) return;
      const targetName = activePin.ghost_author_name || activePin.profiles?.username || 'Üye';
      const { error } = await sb.from('friendships').insert([{ sender_id: currentUser.id, receiver_id: activePin.user_id, sender_name: myProfile.username, receiver_name: targetName, status: 'pending' }]);
      if (error) return showToast('Hata: ' + error.message);
      showToast(`📨 ${targetName} adlı kişiye arkadaşlık isteği gönderildi!`);
    }

    async function checkNotifications() {
      const [{ data: fData }, { data: mData }] = await Promise.all([
        sb.from('friendships').select('id').eq('receiver_id', currentUser.id).eq('status', 'pending'),
        sb.from('direct_messages').select('id').eq('receiver_id', currentUser.id).eq('is_read', false)
      ]);
      const hasNotif = ((fData && fData.length > 0) || (mData && mData.length > 0));
      document.getElementById('notifDot').style.display = hasNotif ? 'block' : 'none';
    }

    async function openFriendsModal() {
      openModal('friendsModal');
      const { data } = await sb.from('friendships').select('*').or(`receiver_id.eq.${currentUser.id},sender_id.eq.${currentUser.id}`).order('created_at', { ascending: false });
      const pList = document.getElementById('pendingList'), aList = document.getElementById('acceptedList');
      const incoming = (data || []).filter(f => f.receiver_id === currentUser.id && f.status === 'pending');
      const responses = (data || []).filter(f => f.sender_id === currentUser.id && f.status !== 'pending');
      const friends = (data || []).filter(f => f.status === 'accepted');

      pList.innerHTML = (incoming.length === 0 && responses.length === 0) ? '<div style="color:var(--muted); font-size:12px;">Yeni bildirim yok.</div>' :
        incoming.map(f => `<div class="card-row"><span><strong>${esc(f.sender_name || 'Üye')}</strong> arkadaş olmak istiyor</span><div style="display:flex; gap:6px;"><button onclick="respondFriend('${f.id}','accepted')" style="padding:5px 10px; border-radius:8px; border:none; background:var(--green); color:#fff; font-weight:700;">Kabul</button><button onclick="respondFriend('${f.id}','rejected')" style="padding:5px 10px; border-radius:8px; border:none; background:var(--danger); color:#fff; font-weight:700;">Red</button></div></div>`).join('') +
        responses.map(f => `<div class="card-row"><span><strong>${esc(f.receiver_name || 'Üye')}</strong> isteğini ${f.status === 'accepted' ? '✅ kabul etti' : '❌ reddetti'}</span></div>`).join('');

      aList.innerHTML = friends.length === 0 ? '<div style="color:var(--muted); font-size:12px;">Henüz arkadaşın yok.</div>' :
        friends.map(f => {
          const isSender = (f.sender_id === currentUser.id);
          const friendId = isSender ? f.receiver_id : f.sender_id;
          const fname = isSender ? f.receiver_name : f.sender_name;
          return `<div class="card-row" style="cursor:pointer;" onclick="openDirectChat('${friendId}', '${esc(fname || 'Arkadaş')}')"><span>🦊 <strong>${esc(fname || 'Vibe Arkadaşı')}</strong></span><span style="padding:5px 11px; border-radius:999px; background:var(--primary); color:#fff; font-size:11px; font-weight:700;">💬 Mesaj Yaz</span></div>`;
        }).join('');
    }

    async function respondFriend(id, status) {
      await sb.from('friendships').update({ status }).eq('id', id);
      showToast(status === 'accepted' ? '🎉 Arkadaşlık kabul edildi!' : 'İstek reddedildi');
      checkNotifications(); openFriendsModal();
    }

    function openDirectChat(friendId, friendName) {
      activeChatFriend = { id: friendId, name: friendName };
      document.getElementById('chatFriendTitle').textContent = '💬 ' + friendName;
      closeModal('friendsModal');
      openModal('chatModal');
      loadDirectMessages();
      if (chatPollTimer) clearInterval(chatPollTimer);
      chatPollTimer = setInterval(loadDirectMessages, 3500);
    }

    function closeChatModal() {
      if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; }
      activeChatFriend = null;
      closeModal('chatModal');
      checkNotifications();
    }

    async function loadDirectMessages() {
      if (!activeChatFriend || !currentUser) return;
      const box = document.getElementById('chatMessagesBox');
      const { data } = await sb.from('direct_messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChatFriend.id}),and(sender_id.eq.${activeChatFriend.id},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      await sb.from('direct_messages').update({ is_read: true }).eq('sender_id', activeChatFriend.id).eq('receiver_id', currentUser.id).eq('is_read', false);

      box.innerHTML = (!data || data.length === 0)
        ? '<div style="color:var(--muted); font-size:12px; text-align:center; margin:auto;">Henüz mesaj yok. İlk mesajı sen gönder! 👋</div>'
        : data.map(m => `<div class="msg-bubble ${m.sender_id === currentUser.id ? 'msg-mine' : 'msg-theirs'}">${esc(m.message_text)}</div>`).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function sendDirectMessage() {
      const input = document.getElementById('dmInput');
      const text = input.value.trim();
      if (!text || !activeChatFriend || !currentUser) return;
      input.value = '';
      const { error } = await sb.from('direct_messages').insert([{ sender_id: currentUser.id, receiver_id: activeChatFriend.id, message_text: text }]);
      if (error) return showToast('Mesaj gönderilemedi: ' + error.message);
      loadDirectMessages();
    }

    async function upvoteCurrentPin() {
      if (!activePin || !currentUser) return;
      const { error } = await sb.from('pin_upvotes').insert([{ pin_id: activePin.id, user_id: currentUser.id }]);
      if (error) return showToast('Zaten doğruladın 🔥');
      const newCount = (activePin.upvotes_count || 1) + 1;
      await sb.from('pins').update({ upvotes_count: newCount }).eq('id', activePin.id);
      activePin.upvotes_count = newCount; document.getElementById('detailUpvotes').textContent = newCount; showToast('🔥 Doğrulandı!');
    }

    async function loadComments(pinId) {
      const list = document.getElementById('commentsList');
      const { data } = await sb.from('pin_comments').select('*, profiles(username)').eq('pin_id', pinId).order('created_at', { ascending: true });
      list.innerHTML = (!data || data.length === 0) ? '<div style="color:var(--muted); font-size:12px;">Henüz yorum yok.</div>' : data.map(c => `<div style="padding:8px; border-radius:10px; background:rgba(255,255,255,0.04); margin-bottom:6px; font-size:13px;"><strong>${esc(c.profiles?.username || 'Üye')}:</strong> ${esc(c.comment_text)}</div>`).join('');
    }

    async function submitComment() {
      const input = document.getElementById('commentInput'), text = input.value.trim();
      if (!text || !activePin || !currentUser) return;
      const { error } = await sb.from('pin_comments').insert([{ pin_id: activePin.id, user_id: currentUser.id, comment_text: text }]);
      if (!error) { input.value = ''; loadComments(activePin.id); }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
